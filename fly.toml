# DDCost PWA — Configurazione Fly.io
# Rinomina l'app prima del deploy: fly apps create ddcost-pwa

app = 'ddcost-pwa'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
